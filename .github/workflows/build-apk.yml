name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Tradebot-debug.apk

      - name: Build unsigned release APK (for external signing)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../Tradebot-release-unsigned.apk

      # Optional signed release build. Add these repository secrets to enable it:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > release.jks
          (cd android && ./gradlew --no-daemon assembleRelease)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out Tradebot-release.apk aligned.apk
          $BT/apksigner verify --print-certs Tradebot-release.apk
          rm -f release.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tradebot-apk
          path: Tradebot-*.apk
          if-no-files-found: error

      # Keeps the latest APK on the `apk` branch for a stable direct-download link:
      # https://github.com/<owner>/<repo>/raw/apk/Tradebot-debug.apk
      - name: Publish latest APK to apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apkbranch
          # Prefer the release build signed with your permanent key (installs as an update every time)
          if [ -f Tradebot-release.apk ]; then cp Tradebot-release.apk /tmp/apkbranch/Tradebot.apk; KIND="release (signed with your key)"; else cp Tradebot-debug.apk /tmp/apkbranch/Tradebot.apk; KIND="debug (temporary key: add signing secrets, see docs/BUILDING.md)"; fi
          cp Tradebot-debug.apk /tmp/apkbranch/
          [ -f Tradebot-release-unsigned.apk ] && cp Tradebot-release-unsigned.apk /tmp/apkbranch/ || true
          cd /tmp/apkbranch
          printf '# Tradebot APK\n\nLatest build of `main` (%s, run #%s): **%s**\n\nDownload: [Tradebot.apk](Tradebot.apk)\n' "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER" "$KIND" > README.md
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "APK build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tradebot-*.apk
          generate_release_notes: true
